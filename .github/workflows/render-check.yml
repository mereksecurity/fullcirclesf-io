name: Render check

on:
  pull_request:
  push:
    branches: [main]

# A newer push supersedes an in-flight run on the same branch.
concurrency:
  group: render-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  render:
    name: Pages render
    runs-on: ubuntu-latest
    defaults:
      run:
        # The harness lives in tests/ so the repository root stays free of a
        # package.json — the root is what Netlify and Vercel publish.
        working-directory: tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run render check
        run: npm run test:render

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 7
